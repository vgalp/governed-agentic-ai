[project]
name = "governed-agentic-ai"
version = "0.1.0"
description = "Open-source reference architecture for deploying multi-agent AI systems safely in healthcare, government, and other regulated environments."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.15.1",
    "fastapi>=0.142.2",
    "mcp<2",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pyjwt[crypto]>=2.10",                 # SMART Backend Services sign-in (fhir/client.py, ADR 013)
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pip>=26.2.1",
    "pytest>=9.1.1",
    "ruff>=0.14",
]
train = [
    "torch>=2.14.1",
    "transformers>=4.48",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["scratchpad", "docs"]

[tool.ruff.lint]
# E/W style, F correctness, I import order, B likely bugs. B905 (zip strict=) and B007 (unused loop
# variable) are style choices this code base does not make; E501 is enforced at 130 columns.
select = ["E", "F", "W", "I", "B"]
ignore = ["B905", "B007"]

[tool.ruff.lint.per-file-ignores]
# Model prompts and test fixtures hold long literal strings that must not be rewrapped.
"eval/*" = ["E501"]
"tests/*" = ["E501"]
"guardrails/classifier.py" = ["E501"]
