[project]
name = "governed-agentic-ai"
version = "0.1.0"
description = "Open-source reference architecture for deploying multi-agent AI systems safely in healthcare, government, and other regulated environments."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.15.1",
    "fastapi>=0.142.2",
    "mcp<2",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pip>=26.2.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
