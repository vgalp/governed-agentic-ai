# Fixed replies when a guardrail blocks. Written for CASEWORKERS at a fictional county
# benefits office, not for applicants. DRAFTS pending review by the office's program
# and legal staff.

crisis: >-
  This may be a safety emergency. If anyone is in immediate danger, call 911. Tell
  your supervisor now and follow the office's safety protocol; do not leave the
  person on their own if they are with you. The 988 Suicide & Crisis Lifeline (call
  or text 988 in the U.S.) can also help. If the client is being hurt or threatened
  by someone, the National Domestic Violence Hotline (1-800-799-7233, or text START
  to 88788) can help them plan for safety.

eligibility_decision: >-
  I can't decide eligibility. That is the eligibility worker's determination under
  the program's rules. I can show what the case record lists (status, documents,
  reported income and payments) to support it.

integrity_judgment: >-
  I can't judge whether someone is honest. If you have a specific concern, refer it
  to the program integrity unit using the office's referral process. I can show
  what the case record lists, such as which income is verified.

unavailable: >-
  Sorry, I can't answer right now because a safety check is unavailable. Please try
  again shortly. If anyone is in danger, call 911 and tell your supervisor.

# Sent when a request has no role, or a role this profile does not define.
role_required: >-
  Please choose your role first. What you can see depends on it, so I can't answer
  until I know whether you're an intake worker, eligibility worker, supervisor or
  quality auditor.

# Sent when an answer refers to a source it was not given, or invents a fill-in field.
ungrounded: >-
  I couldn't give a reliable answer: my draft referred to information that isn't in
  the case records. Please check the case file directly, or ask a more specific
  question.

# Changes (actions.yaml). {placeholders} are filled in by the pipeline.
action_pending: >-
  I've prepared this change, but nothing has been changed yet. It needs approval
  by {approvers}, and it expires in {expires} minutes if no one approves it.
  Proposed: {summary} (approval request {approval_id}).

action_denied: >-
  I can't prepare that change: {reasons}.

action_unclear: >-
  I couldn't prepare that change: {reason}. Please name the applicant and which
  held payment, for example "Release Lena Kovacs's held emergency assistance payment".

# Asked to search the web, but no page from an allowed site could be read. No model answers:
# current information answered from memory would be stale or invented.
no_web_pages: >-
  I searched the web for "{query}" but could not read any page from the sites I
  am allowed to use ({note}). I won't guess at current information from memory.
  You could try different wording, or check an official site directly.

# The answer was written from web pages, and the second model found claims the pages do not
# support (ADR 022). The pages are still listed as sources.
unfaithful: >-
  I looked this up, but the answer I drafted said things the pages I read do not
  support, so I am not giving it. The pages I found are listed below; please read
  them directly.

# faithfulness mode: warn. A claim the pages do not mention (none they contradict): sent with this note.
not_confirmed: >-
  (A second model checked this answer against the pages listed and could not
  confirm every detail from them. Please read the pages for anything that
  matters.)

# A question for a tool this role may not use (every role here has web research; kept so a profile
# change that narrows a role gets a plain reply, not an error).
tool_denied: >-
  {tool} is not available to your role ({role}). It is available to: {roles}.
  Please ask one of them.
