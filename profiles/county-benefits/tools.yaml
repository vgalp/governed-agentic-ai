# Tools this profile can use. The fields are explained in profiles/clinic-assistant/tools.yaml.
# The same two servers as the clinic: what they serve comes from this profile's files.

search_knowledge:
  description: Approved office policies (fictional, samples)
  server: http://127.0.0.1:8100/mcp
  kind: read
  data_label: approved_content
  lane: knowledge

search_records:
  description: Case records, built only from the data classes the role may see
  server: http://127.0.0.1:8101/mcp
  kind: read
  data_label: case_record                  # never leaves the office (routing.never_external_labels)
  lane: records
  receives_identifiers: true               # looks applicants up by name
  role_filtered: true

release_payment:
  description: Releases a held payment, after a supervisor approves (actions.yaml, change:)
  server: http://127.0.0.1:8102/mcp         # the generic change server, same as the clinic's
  kind: change
  data_label: case_record

web_research:
  description: Web research (pages from allowed sites, fetched for this question and cited)
  server: http://127.0.0.1:8105/mcp
  kind: read
  data_label: web_page                     # untrusted public text; never personal data
  lane: knowledge
  when: web_research                       # rules.yaml: only when asked to search the web
  keeps: [LOCATION]                        # a place is the question ("rules in Ontario"); people never
  on_empty: no_web_pages                   # responses.yaml: if no page could be read, say so; no model
                                           # answers a current-events question from memory
  timeout: 90                              # seconds: a search plus several pages at 10 s each
