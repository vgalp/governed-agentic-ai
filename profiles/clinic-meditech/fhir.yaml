# How MEDITECH Expanse's FHIR resources (US Core) become records (ADR 013, ADR 032).
# The same records as clinic-epic/fhir.yaml; only the server and the sign-in differ.
# Paths are simple FHIR paths; {a,b} takes the first with a value; |date and |datetime format dates.
# limit: how many of a record type are read, in pages of 50 (at most 250). When the record holds
# more, the chart brief says the list is incomplete (chart_brief.yaml complete:).

# MEDITECH Greenfield, MEDITECH's developer sandbox. Greenfield does not give outside apps backend
# (system) access: a person signs in once in the browser (scripts/fhir_connect.py), and the token is
# for one test patient. The tool servers refresh it from the token file; nothing is kept in the repo.
server:
  base_url: https://greenfield-prod-apis.meditech.com/v2/uscore/STU6
  auth: smart_user                          # SMART authorization code with PKCE, then refresh tokens
  authorize_url: https://greenfield-prod-apis.meditech.com/oauth/authorize
  token_url: https://greenfield-prod-apis.meditech.com/oauth/token
  client_id_env: MEDITECH_CLIENT_ID         # the app's client ID from Greenfield, in .env
  client_secret_env: MEDITECH_CLIENT_SECRET # its client secret, in .env; never in the repo
  redirect_uri: http://localhost:8765/callback   # register exactly this in Greenfield
  scope: openid fhirUser launch/patient offline_access patient/*.read
  token_store: ~/.config/governed-agentic-ai/meditech/token.json
  docs: docs/meditech/README.md

subject:
  noun: patient
  resource: Patient
  # The sign-in is for one patient: that patient is read, and the question must name them with
  # their date of birth (two identifiers, as patient-safety practice asks). Nothing is searched.
  name_search: {given: given, family: family, birthdate: birthdate}
  record:
    data_class: patient_details
    source_id: {prefix: pt-, keep_last: 8}
    title: "Patient: {name}"
    text: "{name}, born {birthDate}, sex {gender}, lives in {address.city}."

records:
  medications:
    resource: MedicationRequest
    link: patient
    search: {intent: order, status: active}   # US Core servers need intent with the patient
    data_class: medications
    source_id: {prefix: med-, keep_last: 8}
    limit: 200
    title: Current medication
    text: "{subject}: {medicationCodeableConcept.text,medicationReference.display}, ordered {authoredOn|date}."
    optional: {"reasonCode.text,reasonReference.display": " Reason recorded: {reasonCode.text,reasonReference.display}."}

  visits:
    resource: Encounter
    link: patient
    data_class: visit_dates
    source_id: {prefix: enc-, keep_last: 8}
    limit: 3
    title: Past visit
    text: "{subject}: {class.display,class.code} visit on {period.start|date}."
    more_detail:
      data_class: visit_clinical
      text: "{subject}: {type.text,type.coding.display} visit on {period.start|date}."
      optional: {reasonCode.text: " Reason recorded: {reasonCode.text}."}

  # The chart (ADR 023). If the server refuses a combined search (scripts/fhir_check.py shows which),
  # keep the patient and category and drop the other parameter.
  problems:
    resource: Condition
    link: patient
    search: {category: problem-list-item, clinical-status: active}
    data_class: problems
    source_id: {prefix: cond-, keep_last: 8}
    limit: 100
    title: Problem list
    text: "{subject}: {code.text,code.coding.display}, on the problem list since {onsetDateTime,recordedDate|date}."

  allergies:
    resource: AllergyIntolerance
    link: patient
    search: {clinical-status: active}
    data_class: allergies
    source_id: {prefix: alg-, keep_last: 8}
    limit: 200
    title: Allergy
    text: "{subject}: allergy to {code.text,code.coding.display}."
    optional: {reaction.manifestation.text: " Recorded reaction: {reaction.manifestation.text}."}

  vitals:
    resource: Observation
    link: patient
    search: {category: vital-signs}
    data_class: vitals
    source_id: {prefix: vit-, keep_last: 8}
    limit: 30
    title: Vital sign
    text: "{subject}: {code.text,code.coding.display} {valueQuantity.value,component.valueQuantity.value} {valueQuantity.unit,component.valueQuantity.unit}, measured {effectiveDateTime|date}."

max_results: 60
status: MEDITECH Greenfield test record
