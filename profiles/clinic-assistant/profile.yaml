# Profile: a staff assistant for a primary-care clinic (front desk, billing, nurses).
# Answers from clinic records and approved clinic policies only; makes no clinical decisions.
# All patient data is synthetic (Synthea). Select with PROFILE=clinic-assistant.

name: clinic-assistant
title: Clinic staff assistant
description: >-
  Helps clinic staff find information in patient records and clinic policies,
  with a source for every answer. Not a clinical decision tool.
version: 1

models:
  local:
    provider: ollama
    name: mistral
    location: local
    temperature: 0
  # Hosted models, used only for questions that need no patient data and contain no
  # personal information (see routing), and only when the API key is set in .env.
  # With no key set, everything stays local. Model names change: check each provider's
  # current list and change the name here, not in code.
  openai:
    provider: openai
    name: gpt-4.1-mini
    location: external
    # price: {input_per_million: 0, output_per_million: 0}   # US$, from the provider's pricing page (ADR 018)
    api_key_env: OPENAI_API_KEY
  gemini:
    provider: gemini
    name: gemini-2.5-flash
    location: external
    # price: {input_per_million: 0, output_per_million: 0}   # US$, from the provider's pricing page (ADR 018)
    api_key_env: GEMINI_API_KEY
  claude:
    provider: anthropic
    name: claude-haiku-4-5-20251001
    location: external
    # price: {input_per_million: 0, output_per_million: 0}   # US$, from the provider's pricing page (ADR 018)
    api_key_env: ANTHROPIC_API_KEY
  judge:
    provider: ollama
    name: qwen2.5:7b            # judges answers written from web pages (ADR 022); a different model from the answering one.
                                # Chosen over llama3.1:8b, which held back correct answers in testing (2026-11-04)
    location: local
    temperature: 0

routing:
  local_model: local
  # Which hosted model answers general questions. Change this line to switch provider,
  # or start with EXTERNAL_MODEL=gemini (any external model listed above).
  external_model: claude
  # If it fails or has no key, try these in order (still masked), then the local model.
  fallback: [openai, gemini]
  external_allowed: true
  send_external_when: no_personal_info     # anything with a name, phone, etc. stays local
  never_external_entities: [PERSON, PHONE_NUMBER, EMAIL_ADDRESS, LOCATION, US_SSN, CREDIT_CARD]
  never_external_labels: [patient_record]  # record data never leaves the clinic
  local_input: original                    # staff look patients up by name; the local model may see it

tools: tools.yaml                          # each tool: server, kind, data label
records_db: data/clinic.db                 # built locally: see data/README.md
records_map: records.yaml                  # how the database becomes records (no SQL)
roles: roles.yaml                          # who may see which record data
actions: actions.yaml                      # changes the assistant may propose; a person approves
cite_sources: true                         # the model sees source IDs so it can cite them
# What a cited source ID looks like. An answer that cites an ID it was not given is
# blocked (grounding check), e.g. citing the clinic-hours policy for a medication.
source_id_pattern: '\b(kb-cl-\d{3}|pt-[0-9a-f]{8}|apt-\d{4}|med-\d+|enc-[0-9a-f]{8}|clm-[0-9a-f]{8}|lbl-[0-9a-f]{8}|cond-\d+|alg-\d+|vit-\d+|web-[0-9a-f]{8})\b'

prompt: prompt.md
responses: responses.yaml
rules: rules.yaml

classifier:
  model: llama-guard3:8b
  policy: classifier_policy.md
  categories:
    - {code: S1, name: patient safety risk, category: crisis}
    - {code: S2, name: clinical decision, category: medical_advice}
  default_category: medical_advice
  # Questions are checked by the fine-tuned guard classifier (allow / decision / crisis), with
  # this profile's paragraph from classifier/policies.yaml. Answers stay with Llama Guard above.
  # Needs the train group (torch): uv sync --group train. input_engine: llamaguard to switch back.
  input_engine: guard_model
  guard_model: guard-modernbert-v7
  decision_category: medical_advice           # the reply for a forbidden decision

privacy:
  entities: [PERSON, PHONE_NUMBER, EMAIL_ADDRESS, LOCATION, US_SSN, CREDIT_CARD, IP_ADDRESS]
  allow_list: []
  # Medication names are not people: without this, "apixaban" is masked as [PERSON_1] (ADR 024).
  allow_list_files: [privacy/drug_names.txt]

knowledge_base: data/knowledge_base.json

agents:
  planner:
    tools: [search_knowledge, search_records, medication_review, chart_brief, drug_reference, web_research]
  # Makes approved changes only. The planner, which talks to the model, cannot.
  executor:
    tools: [reschedule_appointment]

# Shown as example buttons on the chat page.
examples:
  - What is our cancellation policy?
  - What medications is Chester Aufderhar taking?
  - Check Harold Brinkley's medications for interactions.
  - When is Chester Aufderhar's next appointment?
  - Does Jesse Wolf owe anything?
  - Move Chester Aufderhar's next appointment to November 13 at 10:00.
  - How much insulin should we give Mr Smith?

# A second model checks answers written from web pages against the pages (ADR 022). The judge must
# not be an answering model. strict: an unreadable judge reply withholds the answer in mode withhold;
# in mode warn it is sent with the warning note, since nothing was found contradicted.
faithfulness:
  judge: judge
  for_tools: [web_research]
  strict: true
  mode: warn                # a fact the pages contradict withholds the answer; one they do not mention
                            # is sent with a warning (withhold held back too many plain answers in testing)

# Who is asking, and in which role (ADR 028). demo: the chat page's role menu, for a demonstration
# on one machine (anyone can pick any role). oidc: people sign in with the organization's identity
# provider; their group decides the role, and the role menu is ignored. GOVERNED_SIGN_IN=oidc turns
# it on without editing this file. The values below are the local Keycloak of
# scripts/keycloak_setup.sh; an organization puts its own provider here (Entra ID, Okta, Google ...).
sign_in:
  mode: demo
  issuer: http://127.0.0.1:8180/realms/governed-demo
  audience: governed-api
  client_id: governed-ui
  roles:                    # identity-provider group -> role (roles.yaml); the first match wins
    clinicians: clinician
    nurses: nurse
    front-desk: front_desk
    compliance: compliance
  admin_roles: [compliance] # may see on the access page who is in which group (others see the mapping only)
  # The access page (/access) reads the directory to show who gets which role (ADR 029). Read-only.
  directory:
    provider: keycloak
    url: http://127.0.0.1:8180
    realm: governed-demo
    client_id: governed-directory           # created by scripts/keycloak_setup.sh
    secret_env: KEYCLOAK_DIRECTORY_SECRET   # in .keycloak.env
  # An organization on Microsoft Entra ID instead (app registration with GroupMember.Read.All and
  # User.ReadBasic.All; tokens carry group IDs, so sign_in.roles keys are group object IDs):
  #   directory: {provider: entra, tenant_id: <tenant ID>, client_id: <app ID>, secret_env: ENTRA_DIRECTORY_SECRET}
  # On Okta (a read-only API token):
  #   directory: {provider: okta, org_url: https://<org>.okta.com, token_env: OKTA_API_TOKEN}
