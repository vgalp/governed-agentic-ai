# Profile: a staff assistant for a primary-care clinic (front desk, billing, nurses).
# Answers from clinic records and approved clinic policies only; makes no clinical decisions.
# All patient data is synthetic (Synthea). Select with PROFILE=clinic-assistant.

name: clinic-assistant
title: Clinic staff assistant
description: >-
  Helps clinic staff find information in patient records and clinic policies,
  with a source for every answer. Not a clinical decision tool.
version: 1

models:
  local:
    provider: ollama
    name: mistral
    location: local
    temperature: 0
  # Hosted models, used only for questions that need no patient data and contain no
  # personal information (see routing), and only when the API key is set in .env.
  # With no key set, everything stays local. Model names change: check each provider's
  # current list and change the name here, not in code.
  openai:
    provider: openai
    name: gpt-4.1-mini
    location: external
    api_key_env: OPENAI_API_KEY
  gemini:
    provider: gemini
    name: gemini-2.5-flash
    location: external
    api_key_env: GEMINI_API_KEY
  claude:
    provider: anthropic
    name: claude-haiku-4-5-20251001
    location: external
    api_key_env: ANTHROPIC_API_KEY

routing:
  local_model: local
  # Which hosted model answers general questions. Change this line to switch provider,
  # or start with EXTERNAL_MODEL=gemini (any external model listed above).
  external_model: claude
  # If it fails or has no key, try these in order (still masked), then the local model.
  fallback: [openai, gemini]
  external_allowed: true
  send_external_when: no_personal_info     # anything with a name, phone, etc. stays local
  never_external_entities: [PERSON, PHONE_NUMBER, EMAIL_ADDRESS, LOCATION, US_SSN, CREDIT_CARD]
  never_external_labels: [patient_record]  # record data never leaves the clinic
  local_input: original                    # staff look patients up by name; the local model may see it

tools: tools.yaml                          # each tool: server, kind, data label
records_db: data/clinic.db                 # built locally: see data/README.md
roles: roles.yaml                          # who may see which record data
actions: actions.yaml                      # changes the assistant may propose; a person approves
cite_sources: true                         # the model sees source IDs so it can cite them
# What a cited source ID looks like. An answer that cites an ID it was not given is
# blocked (grounding check), e.g. citing the clinic-hours policy for a medication.
source_id_pattern: '\b(kb-cl-\d{3}|pt-[0-9a-f]{8}|apt-\d{4}|med-\d+|enc-[0-9a-f]{8}|clm-[0-9a-f]{8})\b'

prompt: prompt.md
responses: responses.yaml
rules: rules.yaml

classifier:
  model: llama-guard3:8b
  policy: classifier_policy.md
  categories:
    - {code: S1, name: patient safety risk, category: crisis}
    - {code: S2, name: clinical decision, category: medical_advice}
  default_category: medical_advice

privacy:
  entities: [PERSON, PHONE_NUMBER, EMAIL_ADDRESS, LOCATION, US_SSN, CREDIT_CARD, IP_ADDRESS]
  allow_list: []

knowledge_base: data/knowledge_base.json

agents:
  planner:
    tools: [search_knowledge, search_records]
  # Makes approved changes only. The planner, which talks to the model, cannot.
  executor:
    tools: [reschedule_appointment]

# Shown as example buttons on the chat page.
examples:
  - What is our cancellation policy?
  - What medications is Chester Aufderhar taking?
  - When is Chester Aufderhar's next appointment?
  - Does Jesse Wolf owe anything?
  - Move Chester Aufderhar's next appointment to November 13 at 10:00.
  - How much insulin should we give Mr Smith?