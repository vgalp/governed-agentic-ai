# Tools this profile can use, one entry each. Everything the platform needs to know
# about a tool lives here; which agent may call it is in profile.yaml (agents), and
# which role may use it is in roles.yaml. Checked by profiles/loader.py at startup.
#
#   server                where the tool's MCP server listens
#   kind                  read: returns data · change: changes something. A change tool runs
#                         only after a person approves (actions.yaml), only from the agent that
#                         carries out approved changes, never from the agent that talks to the model
#   data_label            what kind of data it returns; routing decides by it (profile.yaml routing)
#   lane                  where its steps show in the decision trace: knowledge or records
#                         (change tools always show under action)
#   receives_identifiers  gets the real question, e.g. a patient name to look up. Only for tools
#                         whose data never leaves the machine; the audit still holds masked text
#   role_filtered         results are filtered by the data classes the role may see (roles.yaml)
#   when                  optional: called only for questions matching this rules.yaml pattern, and then
#                         alone (no other tools); a role without the tool gets the tool_denied reply
#   answer                model (default): a model writes the answer from the results · direct: the
#                         tool's own text is the answer, quoting its sources; no model is asked

search_knowledge:
  description: Approved clinic policies
  server: http://127.0.0.1:8100/mcp
  kind: read
  data_label: approved_content
  lane: knowledge

search_records:
  description: Patient records, built only from the data classes the role may see
  server: http://127.0.0.1:8101/mcp
  kind: read
  data_label: patient_record               # never leaves the clinic (routing.never_external_labels)
  lane: records
  receives_identifiers: true               # looks patients up by name
  role_filtered: true

reschedule_appointment:
  description: Moves an appointment, after a person approves (actions.yaml, change:)
  server: http://127.0.0.1:8102/mcp         # the generic change server (mcp_servers/changes)
  kind: change
  data_label: patient_record
# Medication review for a clinician (ADR 017): the patient's current medications, and where the FDA
# labels mention one with another, quoted word for word. Called only for questions that ask for it
# (when), and then alone; its text is the answer (answer: direct), so no model rewords the label.
medication_review:
  description: Medication review (where FDA drug labels mention one of the patient's medications with another)
  server: http://127.0.0.1:8103/mcp
  kind: read
  data_label: patient_record               # never leaves the clinic
  lane: records
  receives_identifiers: true               # looks the patient up by name, like search_records
  role_filtered: true                      # needs the medications data class
  when: interaction_review                 # rules.yaml
  answer: direct
