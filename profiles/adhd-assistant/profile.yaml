# Profile: everything that makes this deployment an ADHD planning assistant.
# The pipeline code is shared; a new use case is a new folder like this one.
# Loaded and validated by profiles/loader.py. Select with PROFILE=adhd-assistant.

name: adhd-assistant
title: ADHD planning assistant
description: >-
  Helps adults with ADHD plan, start and finish everyday tasks.
  Not a medical tool: no medication, diagnosis or treatment advice.
version: 1

# Models this profile may use. location: local (runs on this machine or network)
# or external (a third-party service). API keys are never written here: give the
# NAME of an environment variable in api_key_env.
models:
  local:
    provider: ollama
    name: mistral
    location: local
    temperature: 0            # repeatable answers for evaluation
  # Example of an external model (not used: external_allowed is false below).
  # external:
  #   provider: openai_compatible
  #   base_url: https://api.example.com/v1
  #   name: some-model
  #   location: external
  #   api_key_env: EXTERNAL_MODEL_API_KEY

# Which model answers each request. Decided by OPA (policies/routing.rego) and audited;
# the router also enforces that external models only ever receive masked text.
routing:
  local_model: local
  external_model: null        # key in models, or null for none
  external_allowed: false     # this profile never sends anything off the machine
  send_external_when: no_personal_info   # or: masked (masked text may go out)
  never_external_entities: [US_SSN, CREDIT_CARD]   # never sent out, even masked
  never_external_labels: []   # data labels (see tool_data_labels) that never go out
  local_input: masked         # what the local model sees: masked or original

# Label for the data each tool returns, used by routing.
tool_data_labels:
  search_knowledge: approved_content

prompt: prompt.md             # system prompt
responses: responses.yaml     # fixed replies used when a guardrail blocks
rules: rules.yaml             # layer 1 guardrails

# Layer 2 safety classifier.
classifier:
  model: llama-guard3:8b
  policy: classifier_policy.md
  # Priority order: the first code found decides, so crisis wins over everything.
  categories:
    - {code: S1, name: suicide and self-harm risk, category: crisis}
    - {code: S2, name: medical advice, category: medical_advice}
  # An unknown code, or "unsafe" with no code, gets this category (fail safe).
  default_category: medical_advice

# Personal information masked before text reaches tools or the model.
privacy:
  entities: [PERSON, PHONE_NUMBER, EMAIL_ADDRESS, LOCATION, US_SSN, CREDIT_CARD, IP_ADDRESS]
  # Dates and times are left out for now: planning answers depend on them.
  # Medication names are not personal information; never mask them
  # (Presidio sometimes mistakes brand names for people's names).
  allow_list: [Adderall, Ritalin, Vyvanse, Concerta, Focalin, Dexedrine, Strattera, Qelbree,
               Intuniv, Wellbutrin, methylphenidate, atomoxetine, guanfacine, clonidine, bupropion]

# Approved content served by the knowledge-base MCP server.
knowledge_base: data/knowledge_base.json

# Which tools each agent may call. Sent to OPA, which denies everything else.
agents:
  planner:
    tools: [search_knowledge]
