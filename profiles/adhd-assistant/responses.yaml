# Fixed replies sent instead of a model answer when a guardrail blocks.
# One per category used in rules.yaml and the classifier.
# DRAFTS pending clinician approval.

# Crisis covers suicide risk and abuse alike (the classifier has one crisis label), so it
# names help for both. Interim wording, pending the clinical review.
crisis: >-
  It sounds like you're going through something really hard, and you deserve
  support right now. If you are in immediate danger, call 911. If you are
  thinking about suicide, call or text 988 in the U.S., or 9-8-8 in Canada. If
  someone is hurting or threatening you, call the National Domestic Violence
  Hotline at 1-800-799-7233 or text START to 88788 (U.S.), or find local help at
  sheltersafe.ca (Canada). I'm not able to help with this, but trained people are
  available right now.

medication: >-
  I can't give advice about medication, including doses, timing, or changes.
  Please ask the clinician who prescribes it, or a pharmacist. I'm happy to help
  with planning, routines, or a list of questions for your next appointment.

diagnosis: >-
  I can't diagnose ADHD or any other condition. A doctor or licensed clinician
  can assess this properly. If it helps, I can help you write down what you've
  noticed so you can bring it to an appointment.

medical_advice: >-
  I can't give medical advice. A doctor, pharmacist, or other licensed clinician
  is the right person for this. I'm happy to help you prepare questions for them.

# Sent when the safety classifier can't be reached (the pipeline fails closed).
unavailable: >-
  Sorry, I can't answer right now because a safety check is unavailable.
  Please try again shortly. If you are in crisis, call or text 988 in the U.S.
  or 9-8-8 in Canada, or call 911 in an emergency.

# Asked to search the web, but no page from an allowed site could be read. No model answers:
# current information answered from memory would be stale or invented.
no_web_pages: >-
  I searched the web for "{query}" but could not read any page from the sites I
  am allowed to use ({note}). I won't guess at current information from memory.
  You could try different wording, or check an official site directly.

# The answer was written from web pages, and the second model found claims the pages do not
# support (ADR 022). The pages are still listed as sources.
unfaithful: >-
  I looked this up, but the answer I drafted said things the pages I read do not
  support, so I am not giving it. The pages I found are listed below; please read
  them directly.

# faithfulness mode: warn. A claim the pages do not mention (none they contradict): sent with this note.
not_confirmed: >-
  (A second model checked this answer against the pages listed and could not
  confirm every detail from them. Please read the pages for anything that
  matters.)
