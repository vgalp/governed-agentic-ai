# Layer 1 guardrails for the everyday assistant: deterministic, checked before and after the model.
# Format as in profiles/adhd-assistant/rules.yaml. The crisis and warning-sign patterns are the
# same as the other profiles; the decision patterns cover medicine, law and money in general.

patterns:
  crisis:
    terms: ['suicid\w*', kill myself, end my life, end it all, want to die, 'hurt(ing)? myself',
            'self[- ]?harm\w*', no reason to live, overdose, 'cut(ting)? myself']

  # Indirect warning signs (988 Lifeline; American Foundation for Suicide Prevention).
  warning_sign:
    regex:
      - '\b(better off without me|(a )?burden to (everyone|everybody|others|my family|people)|'
      - 'giv(e|ing) away (my|all my) (things|stuff|belongings|possessions)|'
      - 'say(ing)? goodbye to (everyone|everybody|people|my family)|'
      - '(not|never) (to )?wake up (again|tomorrow)|don''t want to wake up|(no|any|the) point (in )?(going on|living))\b'

  # Someone being hurt by another person.
  abuse:
    regex:
      - '\b((he|she|they|my (partner|husband|wife|boyfriend|girlfriend|dad|mom|father|mother|parents?))\s+'
      - '(hits?|hit|beats?|beat|chokes?|choked|threatens? to (kill|hurt)|threatened to (kill|hurt)|'
      - 'won''t let me leave|locks? me in|hurts? me|hurt me))\b'

  medication:
    terms: ['medications?', 'medicines?', meds, 'prescriptions?', 'pills?', 'tablets?', 'antibiotics?',
            'painkillers?', ibuprofen, acetaminophen, tylenol, advil, aspirin, insulin, 'antidepressants?',
            'dosage', 'mg']

  dose_intent:
    terms: [how much, how many, dose, doses, dosage, dosing, increase, decrease, reduce, raise,
            lower, stop taking, stop my, skip, double, switch, change my, 'side effects?', mix,
            combine, with alcohol, safe to take, can i take, should i take, what should i take]

  dose_amount:
    regex: '\b\d+(\.\d+)?\s?(mg|milligrams?|mcg|ml)\b'

  diagnosis_request:
    terms: [do i have, could i have, diagnose me, is this cancer, is it cancer, what is wrong with me,
            'what do i have', am i having a, 'is (it|this) (a )?(stroke|heart attack|infection)']

  legal_own_case:
    regex: '\b(should i (sue|plead|sign|accept the (plea|settlement|offer))|can they (evict|fire|deport|arrest) me|is my (contract|lease|will) (valid|legal|enforceable)|will i (win|lose) (my|the|in) (case|court))\b'

  financial_decision:
    regex: '\b(should i (buy|sell|invest in|short|hold|put my (savings|money) in(to)?)\s|which (stock|crypto|coin|fund|etf)s? (should|to) (i )?(buy|pick|invest))\b'

  # In a model ANSWER: wording that gives a dose, a diagnosis or a trade.
  output_advice:
    terms: [double, increase, decrease, reduce, raise, lower, stop taking, skip, switch to, mix, combine,
            take two, take one, every \d+ hours]

  diagnosis_affirm:
    regex:
      - '\b(you (likely|probably|may|might|could|definitely) have|it (sounds|seems) like you have|'
      - 'this (is|sounds like|looks like) (a |an )?(case of )?)\s*(a |an )?'
      - '(cancer|stroke|heart attack|diabetes|depression|anxiety|bipolar|infection|adhd|autism|pneumonia|appendicitis)\b'

  trade_advice:
    regex: '\b(you should (buy|sell|invest in)|i (would|''d) (buy|sell)|(buy|sell) (it|them|now|the (stock|shares|coin)))\b'

  # Questions that ask for current information from the web (tools.yaml web_research `when`).
  web_research:
    regex: '\b(search the web|web[ -]?search|google (it|this|that|for)|look (it |this )?up online|latest|current|recent|today|right now|this (week|month|year)|news about|what (is|are) the (current|latest|new)|search (the )?\w{2,6}\b|(president|prime minister|premier|governor|mayor|ceo|leader|head) of\b|who is the (current )?(president|prime minister|pm|premier|governor|mayor|ceo|leader|head)|\bpm of\b|how much (does|do|is|are) .{1,40}(cost|worth|price)|is .{1,40} still (open|available|running|in force|the law)|what year is it|what (is|''s) the date)\b'

input:
  - {category: crisis, reason: crisis language in input, any: [crisis]}
  - {category: crisis, reason: suicide warning sign in input, any: [warning_sign]}
  - {category: crisis, reason: abuse disclosed in input, any: [abuse]}
  - {category: medication, reason: medication advice requested, all: [medication], any: [dose_intent, dose_amount]}
  - {category: diagnosis, reason: diagnosis requested, any: [diagnosis_request]}
  - {category: legal, reason: advice on the user's own legal case requested, any: [legal_own_case]}
  - {category: financial, reason: investment decision requested, any: [financial_decision]}

output:
  - {category: medication, reason: model answer contains a dose amount, any: [dose_amount]}
  - {category: medication, reason: model answer gives medication advice, scope: sentence,
     all: [medication], any: [output_advice]}
  - {category: crisis, reason: model answer contains crisis language, any: [crisis]}
  - {category: diagnosis, reason: model answer suggests a diagnosis, any: [diagnosis_affirm]}
  - {category: financial, reason: model answer tells the user what to trade, any: [trade_advice]}
