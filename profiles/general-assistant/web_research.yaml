# Web research (ADR 022): where the everyday assistant may read, and how much.
# search: duckduckgo (HTML endpoint, no key, no account) or searxng (url: http://...).
search: duckduckgo
# Only these sites are fetched. An office widens or narrows this list; empty means any site not denied.
allow:
  - gov
  - edu
  - who.int
  - 988lifeline.org
  - nih.gov
  - cdc.gov
  - fda.gov
  - mayoclinic.org
  - wikipedia.org
  - canada.ca
  - ontario.ca
deny:
  - reddit.com
  - facebook.com
  - x.com
  - twitter.com
# Kept small so the pages, the question and the instructions fit a local model's context window
# (Ollama's default is a few thousand tokens; past it the start of the prompt is dropped).
max_pages: 2
max_chars: 4500
timeout_seconds: 10
