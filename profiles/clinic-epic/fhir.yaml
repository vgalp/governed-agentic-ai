# How Epic's FHIR resources become records (ADR 013): the FHIR counterpart of records.yaml.
# Another FHIR server (Oracle Health, Meditech, a local HAPI server) is another version of this file.
# Paths are simple FHIR paths; {a,b} takes the first with a value; |date and |datetime format dates.
# limit: how many of a record type are read, in pages of 50 (at most 250). When the record holds
# more, the chart brief says the list is incomplete (chart_brief.yaml complete:).

server:
  base_url: https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/R4
  auth: smart_backend                      # signed JWT (RS384), then a short-lived access token
  token_url: https://fhir.epic.com/interconnect-fhir-oauth/oauth2/token
  client_id_env: EPIC_CLIENT_ID            # the app's Non-Production Client ID, in .env
  private_key_env: EPIC_PRIVATE_KEY_PATH   # path to privatekey.pem, in .env; never in the repo
  key_id: gaai-sandbox-1                   # the kid in the published JWK Set (docs/epic/jwks.json)

subject:
  noun: patient
  resource: Patient
  # Epic finds a patient by name and date of birth: two identifiers, as patient-safety practice asks.
  name_search: {given: given, family: family, birthdate: birthdate}
  record:
    data_class: patient_details
    source_id: {prefix: pt-, keep_last: 8}
    title: "Patient: {name}"
    text: "{name}, born {birthDate}, sex {gender}, lives in {address.city}."

records:
  medications:
    resource: MedicationRequest
    link: patient
    search: {status: active}
    data_class: medications
    source_id: {prefix: med-, keep_last: 8}
    limit: 200
    title: Current medication
    text: "{subject}: {medicationCodeableConcept.text,medicationReference.display}, ordered {authoredOn|date}."
    optional: {"reasonCode.text,reasonReference.display": " Reason recorded: {reasonCode.text,reasonReference.display}."}

  visits:
    resource: Encounter
    link: patient
    data_class: visit_dates
    source_id: {prefix: enc-, keep_last: 8}
    limit: 3
    title: Past visit
    text: "{subject}: {class.display,class.code} visit on {period.start|date}."
    more_detail:
      data_class: visit_clinical
      text: "{subject}: {type.text,type.coding.display} visit on {period.start|date}."
      optional: {reasonCode.text: " Reason recorded: {reasonCode.text}."}

  # The chart (ADR 023). The Epic app must be granted these read APIs (R4): Condition,
  # AllergyIntolerance, Observation. Until it is, the sandbox answers these searches with an error
  # and the brief says the record system did not answer.
  problems:
    resource: Condition
    link: patient
    search: {category: problem-list-item, clinical-status: active}
    data_class: problems
    source_id: {prefix: cond-, keep_last: 8}
    limit: 100
    title: Problem list
    text: "{subject}: {code.text,code.coding.display}, on the problem list since {onsetDateTime,recordedDate|date}."

  allergies:
    resource: AllergyIntolerance
    link: patient
    search: {clinical-status: active}
    data_class: allergies
    source_id: {prefix: alg-, keep_last: 8}
    limit: 200
    title: Allergy
    text: "{subject}: allergy to {code.text,code.coding.display}."
    optional: {reaction.manifestation.text: " Recorded reaction: {reaction.manifestation.text}."}

  vitals:
    resource: Observation
    link: patient
    search: {category: vital-signs}
    data_class: vitals
    source_id: {prefix: vit-, keep_last: 8}
    limit: 30
    title: Vital sign
    text: "{subject}: {code.text,code.coding.display} {valueQuantity.value,component.valueQuantity.value} {valueQuantity.unit,component.valueQuantity.unit}, measured {effectiveDateTime|date}."

max_results: 60
status: Epic sandbox test record
