# Every port is published on 127.0.0.1 only: Kafka (here plaintext, no sign-in), OPA (its REST API can
# replace policies) and Kafka UI must never be reachable from the office network.
# Kafka with TLS, a sign-in per service and ACLs: docker-compose.kafka-secure.yml, switched on with
# GOVERNED_KAFKA_SECURE=on ./scripts/dev.sh start (ADR 031). Cloud deployments: deploy/README.md.
# Clients use 127.0.0.1, not "localhost": on a Mac "localhost" tries IPv6 (::1) first, where nothing
# listens now, and the Kafka client logs a "Connection refused" line for every attempt.
services:
  opa:
    image: openpolicyagent/opa:1.21.1
    container_name: opa
    ports:
      - "127.0.0.1:8181:8181"
    # Every request needs OPA_TOKEN (policies/system/authz.rego, audit SC-5); scripts/dev.sh puts it
    # in .env, which docker compose reads. Without it OPA is open, as before.
    command: ["run", "--server", "--addr", ":8181", "--authentication=token", "--authorization=basic",
              "--watch", "/policies"]
    environment:
      OPA_TOKEN: ${OPA_TOKEN:-}
    volumes:
      - ./policies:/policies
  broker:
    image: confluentinc/cp-kafka:8.2.0
    hostname: broker
    container_name: broker
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://127.0.0.1:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    container_name: kafka-ui
    depends_on:
      - broker
      - schema-registry
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # A local identity provider for sign-in (ADR 028), only when asked for: scripts/keycloak_setup.sh
  # starts it (docker compose --profile auth) and creates the test realm, client, groups and users.
  # Development mode, on this machine only. An organization uses its own provider instead.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: keycloak
    profiles: ["auth"]
    command: ["start-dev"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_HOSTNAME: http://127.0.0.1:8180      # the issuer in every token; must match sign_in.issuer
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}   # set by scripts/keycloak_setup.sh
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  keycloak-data:
  kafka-data: