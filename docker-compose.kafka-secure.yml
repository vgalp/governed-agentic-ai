# The secured local Kafka (audit SC-3, ADR 031), on top of docker-compose.yml:
#
#   GOVERNED_KAFKA_SECURE=on ./scripts/dev.sh start
#
# What changes:
#   - Every connection from outside the broker container uses TLS (certs/kafka.pem, signed by the
#     local CA in certs/ca.crt) and signs in with SCRAM-SHA-512: one user per service.
#   - Kafka's own authorizer is on, and nobody may do anything that ops/kafka_access.yaml does not
#     grant (scripts/kafka_secure.sh adds the users and ACLs). The planner cannot read approvals;
#     the audit verifier cannot write; Kafka UI can look but not write.
#   - Topics are no longer created on first use.
#   - Administration (topics, users, ACLs) happens only inside the broker container, on listeners
#     bound to its own loopback address: "docker exec broker ..." works, nothing on the network can.
#   - Schema Registry, which nothing here uses, is not started.
#
# Listener names avoid "SSL" and "SASL" on purpose: the Confluent image's start script then does not
# demand Java keystores, and the broker reads the PEM file directly.
services:
  broker:
    environment:
      KAFKA_LISTENERS: 'CONTROLLER://localhost:29093,LOCAL://localhost:29094,INTERNAL://broker:29092,EXTERNAL://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'LOCAL://localhost:29094,INTERNAL://broker:29092,EXTERNAL://127.0.0.1:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,LOCAL:PLAINTEXT,INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'LOCAL'
      # Sign-in: SCRAM-SHA-512 on both network listeners.
      KAFKA_SASL_ENABLED_MECHANISMS: 'SCRAM-SHA-512'
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      # TLS: one PEM file with the key, the certificate and the CA (./scripts/certs.sh kafka).
      KAFKA_SSL_KEYSTORE_TYPE: 'PEM'
      KAFKA_SSL_KEYSTORE_LOCATION: '/etc/kafka/secrets/kafka.pem'
      KAFKA_SSL_ENABLED_PROTOCOLS: 'TLSv1.3,TLSv1.2'
      KAFKA_SSL_CLIENT_AUTH: 'none'
      # Authorization: deny unless an ACL allows. Only the loopback listeners inside the container
      # (no sign-in, so the ANONYMOUS user) may administer.
      KAFKA_AUTHORIZER_CLASS_NAME: 'org.apache.kafka.metadata.authorizer.StandardAuthorizer'
      KAFKA_SUPER_USERS: 'User:ANONYMOUS'
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - ./certs/kafka.pem:/etc/kafka/secrets/kafka.pem:ro

  schema-registry:
    profiles: ["schema-registry"]

  kafka-ui:
    # No "!override" tags, so any Docker Compose version merges this the same way. The Schema
    # Registry address from docker-compose.yml stays; Kafka UI shows it as offline.
    environment:
      KAFKA_CLUSTERS_0_NAME: local (secured)
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-512
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka-ui" password="${KAFKA_PASSWORD_KAFKA_UI:-}";'
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /certs/ca.crt
      KAFKA_CLUSTERS_0_READONLY: "true"
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
