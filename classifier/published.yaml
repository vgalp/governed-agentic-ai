# Published guard classifiers: where each one is, at which commit, and the SHA-256 of its weights.
# classifier/fetch.py downloads exactly this commit and refuses weights with any other hash.
# Quote every value ("...") so YAML never reads a hash as a number.
# Fill in after `python -m classifier.publish ... --upload <repo>` prints these values.

guard-modernbert-v4:
  repo: "vgalp/guard-modernbert-v4"
  revision: "ae5cb712dbaf5a4a0a80cbf88dce179f9fc7003f"
  sha256: "f85591407ded9320dbd1b4c12ae5ab2bad44d060eacd85dd37cd98892ec4e9ea"

guard-modernbert-v6.1:          # the profiles' guard since 2026-10-29 (eval/results/guard_v6_notes.md)
  repo:                         # vgalp/guard-modernbert-v6.1, after the upload
  revision:                     # the commit the upload printed
  sha256:                       # model.safetensors; begins c58d0c88d050 (as scored on test set v5 and benchmark v1)
