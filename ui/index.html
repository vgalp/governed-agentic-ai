<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Governed Chat</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677085; --line: #e3e6ec;
    --user: #1f4fd1; --user-text: #ffffff; --ok: #1a7f4b; --ok-bg: #e6f4ec;
    --block: #a15c00; --block-bg: #fdf1df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #98a0b3; --line: #2b313d;
      --user: #3b6cf0; --ok: #5fd39a; --ok-bg: #173226; --block: #f2b25c; --block-bg: #3a2a12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .app { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 16px; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 2px 0 12px; color: var(--muted); font-size: 13px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .examples button { border: 1px solid var(--line); background: var(--panel); color: var(--text);
                     border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 0; }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge { font: 600 11px/1 ui-monospace, Menlo, monospace; padding: 4px 6px; border-radius: 6px; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.block { color: var(--block); background: var(--block-bg); }
  .badge.role { color: var(--text); background: rgba(127, 127, 127, .08); border: 1px solid var(--line); }
  .badge.restricted { color: #8a5a00; background: #fdf1d8; }
  .rolebar { display: flex; gap: 8px; align-items: center; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .rolebar select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line);
                    background: var(--panel); color: var(--text); }
  .badge.route { color: var(--muted, #555); background: rgba(127, 127, 127, .14); }
  .badge.wait { color: #1f4fd1; background: #e8eefc; }
  .status { margin-top: 6px; font-size: 13px; }
  .pending { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  textarea { flex: 1; resize: none; height: 48px; padding: 12px; border-radius: 10px; font: inherit;
             border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  form button { padding: 0 18px; border: 0; border-radius: 10px; background: var(--user); color: #fff; font: inherit; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Governed Agentic AI · <span id="ptitle">test chat</span></h1>
    <p>Research prototype. Not a medical device and not for emergencies. Use synthetic data only.</p>
  </header>

  <div class="rolebar" id="rolebar" hidden>
    <label for="role">Your role</label>
    <select id="role"><option value="">Choose a role…</option></select>
    <span>Demo only: a real deployment takes the role from sign-in.</span>
  </div>
  <div class="examples" id="examples"></div>
  <div id="log"></div>

  <form id="form">
    <textarea id="input" placeholder="Type a message. Enter to send, Shift+Enter for a new line."></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
const roleSelect = document.getElementById("role");
const log = document.getElementById("log");
const input = document.getElementById("input");
const send = document.getElementById("send");

function add(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function meta(div, data, seconds) {
  const m = document.createElement("div");
  m.className = "meta";
  const badge = document.createElement("span");
  const g = data.guardrail;
  if (data.approval) {
    badge.className = "badge wait";
    badge.textContent = `AWAITING APPROVAL · ${data.approval.approval_id}`;
    followApproval(div, badge, data.approval.approval_id);
  } else if (g) {
    badge.className = "badge block";
    badge.textContent = `BLOCKED · ${g.stage} · ${g.layer || "rules"} · ${g.category}`;
  } else {
    badge.className = "badge ok";
    badge.textContent = "ANSWERED";
  }
  m.appendChild(badge);
  if (data.access) {
    const r = document.createElement("span");
    r.className = "badge role";
    r.textContent = `ROLE · ${data.access.role_title}`;
    m.appendChild(r);
    if (data.access.restricted && data.access.restricted.length) {
      const x = document.createElement("span");
      x.className = "badge restricted";
      x.textContent = `RESTRICTED · ${data.access.restricted.join(", ")}`;
      x.title = "Data this role may not see. It was never sent to the model.";
      m.appendChild(x);
    }
  }
  if (data.route) {
    const r = document.createElement("span");
    r.className = "badge route";
    const name = {openai: "OpenAI", gemini: "Gemini", anthropic: "Claude"}[data.route.provider];
    r.textContent = data.route.target === "external"
      ? `EXTERNAL MODEL · ${name ? name + " · " : ""}${data.route.model}` : `LOCAL MODEL · ${data.route.model}`;
    m.appendChild(r);
  }
  const extra = document.createElement("span");
  const sources = (data.sources || []).map(s => s.id).join(", ");
  extra.textContent = `${seconds.toFixed(1)}s` + (sources ? ` · sources: ${sources}` : "");
  m.appendChild(extra);
  div.appendChild(m);
}

// A proposed change: show what happens to it (approved and done, rejected, expired).
const FINAL = {done: "badge ok", rejected: "badge block", expired: "badge block", refused: "badge block", failed: "badge block"};
async function followApproval(div, badge, id) {
  for (let i = 0; i < 720; i++) {
    await new Promise(res => setTimeout(res, 3000));
    let a;
    try { a = await (await fetch(`/approvals/${id}`)).json(); } catch { continue; }
    if (!FINAL[a.status]) { if (a.status === "approved") badge.textContent = `APPROVED · ${id} · making the change…`; continue; }
    badge.className = FINAL[a.status];
    badge.textContent = `${a.status.toUpperCase()} · ${id}`;
    const s = document.createElement("div");
    s.className = "status";
    if (a.status === "done") s.textContent = `Done: ${a.result.summary}.`;
    else if (a.status === "expired") s.textContent = "No one approved this in time. Nothing was changed.";
    else if (a.status === "rejected") s.textContent = "This change was rejected. Nothing was changed.";
    else s.textContent = `Not made: ${(a.reasons || []).join("; ")}. Nothing was changed.`;
    div.appendChild(s);
    return;
  }
}

async function ask(text) {
  add("user", text);
  const bot = add("bot pending", "Checking and thinking…");
  send.disabled = true;
  const started = performance.now();
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: "ui", message: text, role: roleSelect.value || null }),
    });
    const { request_id } = await r.json();
    for (let i = 0; i < 180; i++) {
      const data = await (await fetch(`/chat/${request_id}`)).json();
      if (data.status === "done") {
        bot.className = "msg bot";
        bot.textContent = data.answer;
        meta(bot, data, (performance.now() - started) / 1000);
        return;
      }
      await new Promise(res => setTimeout(res, 1000));
    }
    bot.textContent = "No answer after 3 minutes. Is the planner running? Try: ./scripts/dev.sh status";
  } catch (e) {
    bot.textContent = "Could not reach the API: " + e;
  } finally {
    send.disabled = false;
    log.scrollTop = log.scrollHeight;
  }
}

// Load the active profile: title, roles (if any) and example questions.
fetch("/profile").then(r => r.json()).then(p => {
  document.getElementById("ptitle").textContent = p.title;
  document.title = `Governed Agentic AI · ${p.title}`;
  if (p.roles.length) {
    for (const r of p.roles) roleSelect.add(new Option(r.title, r.key));
    document.getElementById("rolebar").hidden = false;
  }
  for (const ex of p.examples) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = ex;
    b.onclick = () => { if (!send.disabled) ask(ex); };
    document.getElementById("examples").appendChild(b);
  }
}).catch(() => {});

document.getElementById("form").onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = "";
  ask(text);
};
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("form").requestSubmit();
  }
});
</script>
</body>
</html>
