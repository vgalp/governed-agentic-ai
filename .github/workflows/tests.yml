name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache spaCy model
        uses: actions/cache@v4
        with:
          path: .venv/lib/python3.11/site-packages/en_core_web_lg
          key: spacy-en_core_web_lg-3.8.0

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_lg

      - name: Run tests
        run: uv run pytest -v

  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.21.1

      - name: Check, format-check and test policies
        run: |
          opa check policies/
          opa fmt --fail --list policies/
          opa test policies/ -v
